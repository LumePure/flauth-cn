name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format code
        run: dart format lib

      - name: Commit generated changes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib
          git diff --cached --quiet || git commit -m "style: sync l10n and format"
          git push

      - name: Run linter
        run: |
          make lint

      - name: Run tests
        run: |
          make test
